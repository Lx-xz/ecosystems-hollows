modLoader = "javafml"
loaderVersion = "[4,)"
license = "MPL-2.0"

# Mixins: o ácido do Alex's Caves conta como água para os Pokémon Toxian (veja ToxianFluids).
[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Cobblemon Ecosystems: Hollows, Chasms and Cavities"
authors = "luiz"
description = '''
Compat do Cobblemon Ecosystems com o Alex's Caves (port do Raguto): os animais das cavernas dão lugar a
Pokémon, com formas regionais próprias de cada bioma, como o Stufful e o Bewear Candyan de gelatina.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "[1.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon_ecosystems"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
